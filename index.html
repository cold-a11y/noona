<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혜택충전소 :: 기후행동 기후소득</title>
    <link rel="stylesheet" href="./css/style-ggam.css">

</head>
<body>
    <header>
        <div class="head-section">
            <div class="inner wd-max">
                <h1>
                    <a href="" title="혜택충전소">혜택충전소</a>
                </h1>
                <div class="btn-Box">
                    <button class="btn-alert"></button>
                    <button class="btn-store"></button>
                    <button class="btn-menu"></button>
                </div>
            </div>
        </div>
    </header>
    
    <div class="main-section wd-max">
        <!-- PIN Button -->
        <div class="wd-gap">
            <button class="btn-conBx btn-pinNo wd-igap">
                <h2 class="tit">혜택 충전소 PIN</h2>
                <div class="conBx-vi">
                    <span>3TWFNX1C</span>
                    <i class="go-arw wh"></i>
                </div>
            </button>
        </div>
        <!-- End PIN Button -->
    
        <!-- User-info -->
        <div class="wd-gap">
            <button class="btn-conBx btn-benefit wd-igap">
                <div class="tit">
                    <h2>혜택 포인트</h2>
                    <p><span class="date">2025.08.30</span>일까지 사용가능</p>
                </div>
                <div class="conBx-vi">
                    <span class="point">58,248</span>
                    <i class="go-arw"></i>
                </div>
            </button>
    
            <div class="sect-coupon">
                <button class="btn-conBx btn-coupon wd-igap">
                    <h2 class="tit">보유 쿠폰</h2>
                    <div class="conBx-vi">
                        <span class="coupon">10</span>
                        <i class="go-arw"></i>
                    </div>
                </button>
                <button class="btn-notice">
                    <h3><i class="noti">공지</i> 8월 혜택 충전소 운영안내 안내 빵빵빵 우라랄랄 쿵디루 방압</h3>
                </button>
            </div>
        </div>
        <!-- End User-info -->
    
        <!-- Button Box in ggact -->
        <div class="btnBx-ggat wd-gap">
            <div class="inner">
                <div class="title">
                    <p>혜택 충전소 즐기기</p>
                    <h2>오늘의 혜택</h2>
                </div>
                <div class="button-Box30">
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/data-arrived 1.png" alt="">
                        </div>
                        <p class="tit">오늘의 <span>랜덤박스</span></p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/buy-upgrade-20.png" alt="">
                        </div>
                        <p class="tit">돌려볼렛 <span>행운룰렛</span></p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/sell-230.png" alt="">
                        </div>
                        <p class="tit">아슬아슬 <span>사다리게임</span></p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/sell-230.png" alt="">
                        </div>
                        <p class="tit">아슬아슬 <span>사다리게임</span></p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/gift-20.png" alt="">
                        </div>
                        <p class="tit">두근두근 <span>선물뽑기</span></p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/button_20.png" alt="">
                        </div>
                        <p class="tit">버튼 <span>누르기</span></p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/robot-20.png" alt="">
                        </div>
                        <p class="tit">게임하기</p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/circled-up-20.png" alt="">
                        </div>
                        <p class="tit">앱 다운받기</p>
                    </button>
                    <button class="item">
                        <div class="imgBx">
                            <img src="./images/btn-imgs/run-command-20.png" alt="">
                        </div>
                        <p class="tit">뉴스 보기</p>
                    </button>
                </div>
            </div>
        </div>
        <!-- End Button Box in ggact -->

        <!-- Middle Banner Section -->
        <div class="midBan-sect wd-gap">
            <a href="">
                <img src="./images/banner/007.jpg" alt="">
            </a>
        </div>
        <!-- End Middle Banner Section -->

        <!-- FAQ Section -->
        <div class="faq-sect wd-gap">
            <h2>자주 묻는 질문</h2>
            <button class="btn-conBx btn-faq wd-igap">
                <div class="tit">
                    어떤 서비스 인가요?
                </div>
                <div class="conBx-vi">
                   <span>답변보기</span>
                </div>
            </button>            
            <button class="btn-conBx btn-faq wd-igap">
                <div class="tit">
                    혜택 포인트는 무엇인가요?
                </div>
                <div class="conBx-vi">
                   <span>답변보기</span>
                </div>
            </button>            
            <button class="btn-conBx btn-faq wd-igap">
                <div class="tit">
                    수집하는 개인정보가 있나요?
                </div>
                <div class="conBx-vi">
                   <span>답변보기</span>
                </div>
            </button>            
            <button class="btn-conBx btn-faq wd-igap">
                <div class="tit">
                    PIN은 무엇인가요?
                </div>
                <div class="conBx-vi">
                   <span>답변보기</span>
                </div>
            </button>            

        </div> 
        <!-- End FAQ Section -->

        <!-- Bottom Banner Section -->
        <div class="midBan-sect wd-gap">
            <a href="">
                <img src="./images/banner/1min000_20250804.jpg" alt="">
            </a>
        </div>         
        <!-- End Bottom Banner Section -->

    </div>
    <p>테스트 입니다.</p>
    
</body>
</html>
